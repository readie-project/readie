syntax = "proto3";

option go_package = "github.com/illinoisdata/checkpoint-restore-for-serverless/worker/proto";

// Message used for code execution requests from clients
message ClientExecutionRequest {
  string request_id = 1;
  string session_id = 2;
  bytes  payload    = 3;
}

// Message used for code execution responses to clients
message ClientExecutionResponse {
  string request_id = 1;
  string session_id = 2;
  bool   success    = 3;
  string stdout     = 4;
  string stderr     = 5;
}

// Service on the main node to handle execution requests from external clients
service ProxyService {
  // Bi-directional streaming RPC for streaming code execution input and output
  rpc RequestExecution(stream ClientExecutionRequest) returns (stream ClientExecutionResponse);
}