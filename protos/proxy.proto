syntax = "proto3";

import "resources.proto";

option go_package = "github.com/illinoisdata/checkpoint-restore-for-serverless/worker/proto";

// Per-call configuration the client sends as the first message of a stream.
message ExecutionConfig {
  // Top-level module names the function refers to, from the client's static
  // analysis. Forwarded to the worker so it can pick a checkpoint that already
  // imported them. Attribution/selection only: not a memory hint.
  repeated string imports = 1;

  // Resource budgets the user set on the decorator (memory, GPU memory, ...).
  // A budget with alloc == 0 asks the router to apply its default for that kind.
  repeated ResourceBudget budgets = 2;
}

// Message used for code execution requests from clients
message ClientExecutionRequest {
  string request_id = 1;
  string session_id = 2;
  reserved 3; // was ResourceEstimation resources; replaced by config below
  oneof data {
    bytes payload = 4;
    ExecutionConfig config = 5;
  }
}

// Message used for code execution responses to clients
message ClientExecutionResponse {
  string request_id = 1;
  string session_id = 2;
  bool success = 3;
  oneof data {
    string logs = 4;
    bytes payload = 5;
  }

  // Where the execution actually ran. Attribution only: a client cannot ask
  // for a particular worker or container, but it can report which one was slow.
  string worker_id = 6;
  string container_id = 7;
}

// Service on the router to handle execution requests from external clients
service ProxyService {
  // Bi-directional streaming RPC for streaming code execution input and output
  rpc RequestExecution(stream ClientExecutionRequest) returns (stream ClientExecutionResponse);
}
