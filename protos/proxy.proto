syntax = "proto3";

import "resources.proto";

option go_package = "github.com/illinoisdata/readie/worker/proto";

// Per-call configuration the client sends as the first message of a stream.
message ExecutionConfig {
  // Top-level module names the function refers to, from the client's static
  // analysis. Forwarded to the worker so it can pick a checkpoint that already
  // imported them. Attribution/selection only: not a memory hint.
  repeated string imports = 1;

  // Resource budgets the user set on the decorator (memory, GPU memory, ...).
  // A budget with alloc == 0 asks the router to apply its default for that kind.
  repeated ResourceBudget budgets = 2;

  // Whether the function needs a GPU. The router also treats any GPU-memory
  // budget as a GPU request, so this covers a GPU function that names no size.
  bool gpu = 3;

  // When true, the router skips checkpoint restore for this call and always
  // cold-starts. Session affinity (warm-container reuse) still applies; the
  // router rejects this only when the session's warm container was itself
  // restored from a checkpoint.
  bool disable_optimized_execution = 4;

  // Opt in to a capability for one best-effort client completion report.
  bool client_reports = 5;
}

// Message used for code execution requests from clients
message ClientExecutionRequest {
  string request_id = 1;
  string session_id = 2;
  reserved 3; // was ResourceEstimation resources; replaced by config below
  oneof data {
    bytes payload = 4;
    ExecutionConfig config = 5;
  }
}

// Message used for code execution responses to clients
message ClientExecutionResponse {
  string request_id = 1;
  string session_id = 2;
  bool success = 3;
  oneof data {
    string logs = 4;
    bytes payload = 5;
  }

  // Where the execution actually ran. Attribution only: a client cannot ask
  // for a particular worker or container, but it can report which one was slow.
  string worker_id = 6;
  string container_id = 7;
}

// Client-observed completion, independent of the server execution outcome.
enum ClientReportOutcome {
  CLIENT_REPORT_OUTCOME_UNKNOWN = 0;
  CLIENT_REPORT_OUTCOME_SUCCESS = 1;
  CLIENT_REPORT_OUTCOME_ERROR = 2;
  CLIENT_REPORT_OUTCOME_CANCELLED = 3;
}

// Bounded classifications only; no exception messages or user data.
enum ClientReportError {
  // Unset: the outcome is SUCCESS or CANCELLED.
  CLIENT_REPORT_ERROR_UNKNOWN = 0;
  CLIENT_REPORT_ERROR_REMOTE_EXECUTION = 1;
  CLIENT_REPORT_ERROR_EMPTY_RESULT = 2;
  CLIENT_REPORT_ERROR_SERIALIZATION = 3;
  CLIENT_REPORT_ERROR_TIMEOUT = 4;
  CLIENT_REPORT_ERROR_AUTHORIZATION = 5;
  CLIENT_REPORT_ERROR_INVALID_REQUEST = 6;
  CLIENT_REPORT_ERROR_RESOURCE_EXHAUSTED = 7;
  CLIENT_REPORT_ERROR_SESSION_EXPIRED = 8;
  CLIENT_REPORT_ERROR_UNAVAILABLE = 9;
  CLIENT_REPORT_ERROR_TRANSPORT = 10;
  CLIENT_REPORT_ERROR_CLIENT = 11;
}

// One immutable completion report, authorized by initial execution metadata.
message SubmitClientReportRequest {
  // Opaque bearer capability. Never log this value.
  string token = 1;
  int64 start_time_unix_ns = 2;
  int64 end_time_unix_ns = 3;
  // Measured with a monotonic clock, not by subtracting wall timestamps.
  uint64 duration_ns = 4;
  ClientReportOutcome outcome = 5;
  ClientReportError error = 6;
}

// Acceptance acknowledges best-effort export, not durable backend delivery.
message SubmitClientReportResponse {}

// Service on the router to handle execution requests from external clients
service ProxyService {
  // Bi-directional streaming RPC for streaming code execution input and output
  rpc RequestExecution(stream ClientExecutionRequest) returns (stream ClientExecutionResponse);

  // Submit one logical report; identical retries are idempotent until expiry.
  rpc SubmitClientReport(SubmitClientReportRequest) returns (SubmitClientReportResponse);
}
