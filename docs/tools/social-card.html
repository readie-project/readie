<!doctype html>
<!--
  Source of the social card: the 1200 x 630 image that link previews show (Open Graph and
  Twitter cards). It follows assets/banner-tagline-dark.png and banner-tagline-light.png,
  scaled to 1200 x 630: the wordmark and the tagline, centered, in the colors listed in
  assets/README.md, with the site address below and an accent bar along the bottom. The site uses the dark card. Render both from docs/:

  CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  "$CHROME" --headless --hide-scrollbars --window-size=1200,630 \
    --screenshot=static/img/social-card.png "file://$PWD/tools/social-card.html?theme=dark"
  cp static/img/social-card.png ../assets/social-card-dark.png
  "$CHROME" --headless --hide-scrollbars --window-size=1200,630 \
    --screenshot=../assets/social-card-light.png "file://$PWD/tools/social-card.html?theme=light"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Readie social card</title>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'light') {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<style>
  :root { --bg: #16181d; --ink: #e3e7ea; --ink-2: #a3aeb7; --accent: #8db0f8; }
  :root[data-theme='light'] { --bg: #ffffff; --ink: #2a3138; --ink-2: #56626c; --accent: #2a5db8; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    box-sizing: border-box; border-bottom: 14px solid var(--accent);
  }
  svg { width: 425px; height: auto; display: block; overflow: visible; }
  .trail { fill: none; stroke: var(--accent); stroke-width: 82; stroke-linecap: round; }
  .word { fill: var(--ink); }
  p {
    margin: 40px 0 0; max-width: 820px;
    font-size: 29px; font-weight: 500; line-height: 1.35;
    color: var(--ink-2); text-align: center;
  }
  .url { margin-top: 32px; font-size: 24px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); }
</style>
</head>
