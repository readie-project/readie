services:
    router:
        build:
            context: ./router
        ports:
            - "50051:50051"
        container_name: router
        healthcheck:
            test:
                [
                    "CMD",
                    "grpcurl",
                    "-plaintext",
                    "router:50051",
                    "grpc.health.v1.Health/Check",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
    worker:
        build:
            context: ./worker
        ports:
            - "50052:50052"
        container_name: worker
        depends_on:
            router:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "grpcurl",
                    "-plaintext",
                    "worker:50052",
                    "grpc.health.v1.Health/Check",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
