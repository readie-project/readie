[project]
name = "crfs-pipeline"
version = "0.1.0"
description = "Offline pipeline: analyses the request corpus and captures gVisor checkpoints"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "packaging>=26.3",
]

[project.optional-dependencies]
# Corpus generation calls a hosted model. It is an authoring step, not part of
# building checkpoints, so it stays out of the default install and out of the
# pipeline image.
corpus = [
    "openai>=2.53.0",
    "python-dotenv>=1.0",
]

[project.scripts]
crfs-pipeline = "crfs_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crfs_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F","E","W","I","N","UP","B","A","C4","DTZ","T20","PT","RET","SIM","ARG","PTH","ERA","PL","RUF","S","TID","D","TRY","EM","BLE","FBT"]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913",
    # The pipeline is a command-line tool whose output is its progress report.
    # A logging framework here would add configuration for one consumer: a human
    # watching a build that takes minutes.
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "D100", "D101", "D102", "D103", "D104", "PLR2004",
    "ARG001", "ARG002", "PLC0415", "SLF001", "EM101", "TRY003", "TRY301", "S108",
    "S603",  # tests spawn python with a fixed argv on purpose
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openai.*", "dotenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/crfs_pipeline"]
