receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed
  otlphttp/grafana:                              
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT} 
    headers:                                     
      Authorization: ${env:GRAFANA_OTLP_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlphttp/grafana]
