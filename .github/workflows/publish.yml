name: Publish pkg to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pkg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false

      # The release's tag names the version; a mismatch would publish the wrong one.
      - name: Check tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match pkg/pyproject.toml version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: uv build --no-sources

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: pkg/dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.6

      - name: Publish
        run: uv publish
