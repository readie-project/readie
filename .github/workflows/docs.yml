name: Docs

# Builds the Docusaurus site on every pull request (a broken link or anchor fails
# the build) and deploys it to GitHub Pages when a change lands on main.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "protos/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "protos/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Where the playground sends code.
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}

      - name: Upload site as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  # The protobuf reference page is generated from protos/*.proto and committed,
  # so a proto change must be followed by `make docs-protos`.
  protos-reference:
    name: protobuf reference is current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: worker/go.mod

      - name: Install protoc and protoc-gen-doc
        run: |
          make -C worker tools
          make docs-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate
        run: make docs-protos

      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "::error::docs/docs/architecture/protos.md is stale; run 'make docs-protos' and commit the result"
            git diff --stat
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs:
      - build
      - protos-reference
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
