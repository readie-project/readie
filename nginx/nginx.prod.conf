events {}

http {
    # A backstop per client for the playground. The service enforces the limit that visitors
    # see (20 requests in 60 seconds); this one is looser so that it only catches abuse.
    limit_req_zone $binary_remote_addr zone=playground:10m rate=60r/m;

    upstream grpc_router {
        server router:50051;
    }

    upstream playground {
        server playground:8080;
    }

    server {
        listen 443 ssl;
        http2 on;
        
        # Public hostname of the router, and the default address of the client.
        server_name api.readie.org;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Health check for load balancers, uptime monitors and the docs site. It answers from
        # nginx itself and never reaches an upstream, so it stays cheap and unauthenticated.
        # The docs site is on another origin and reads the status, so CORS is open for GET.
        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            return 200 '{"status":"ok"}';
        }

        # The playground's MCP route. A tool call answers in one JSON response when the
        # execution ends, so it needs a read timeout as long as the longest execution,
        # which the general /playground/ location does not give.
        location = /playground/mcp {
            proxy_pass http://playground/mcp;

            limit_req zone=playground burst=10 nodelay;
            # The code limit is enforced by the service; this leaves room for JSON-RPC framing.
            client_max_body_size 64k;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # The docs playground. /playground/ goes to the FastAPI service; every other
        # path (gRPC, /ProxyService/...) still goes to the router below.
        location /playground/ {
            rewrite ^/playground/(.*)$ /$1 break;
            proxy_pass http://playground;

            limit_req zone=playground burst=10 nodelay;
            client_max_body_size 32k;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # The response is a server-sent event stream; buffering would hold it back.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        location / {
            grpc_pass grpc://grpc_router;

            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
    }

    # The HTTP execution API on its own hostname. The endpoint is the root path, so
    # POST https://run.readie.org runs code. /mcp is the MCP server for AI agents, which runs
    # code through the same checks, rate limit and runner. The only other path is /healthz,
    # and every other path answers 404, so the gRPC router is never reachable through it.
    # The certificate must list this name (one certificate covers all three hostnames).
    server {
        listen 443 ssl;
        http2 on;

        server_name run.readie.org;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            return 200 '{"status":"ok"}';
        }

        # The exact match "/" takes only the root path. The service route is /run, and the URI
        # in proxy_pass replaces the request path with it.
        location = / {
            proxy_pass http://playground/run;

            limit_req zone=playground burst=10 nodelay;
            client_max_body_size 32k;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # The response is a server-sent event stream; buffering would hold it back.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # The playground's MCP route (Claude Code, Codex, claude.ai and ChatGPT connectors).
        location = /mcp {
            proxy_pass http://playground/mcp;

            limit_req zone=playground burst=10 nodelay;
            # The code limit is enforced by the service; this leaves room for JSON-RPC framing.
            client_max_body_size 64k;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            # A tool call answers in one JSON response when the execution ends, with nothing
            # sent before it, so the read timeout must cover the longest execution.
            proxy_read_timeout 1h;
        }

        location / {
            return 404;
        }
    }
}
