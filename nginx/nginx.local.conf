events {}

http {
    # A backstop per client for the playground. The service enforces the limit that visitors
    # see (10 runs in 60 seconds); this one is looser so that it only catches abuse.
    limit_req_zone $binary_remote_addr zone=playground:10m rate=30r/m;

    upstream grpc_router {
        server router:50051;
    }

    upstream playground {
        server playground:8080;
    }

    server {
        listen 50051 http2;

        # Health check for load balancers, uptime monitors and the docs site. It answers from
        # nginx itself and never reaches an upstream, so it stays cheap and unauthenticated.
        # The docs site is on another origin and reads the status, so CORS is open for GET.
        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            return 200 '{"status":"ok"}';
        }

        # The playground's evaluation route is for internal use only
        location /playground/eval/ {
            return 404;
        }

        # The docs playground. /playground/ goes to the FastAPI service; every other
        # path (gRPC, /ProxyService/...) still goes to the router below.
        location /playground/ {
            rewrite ^/playground/(.*)$ /$1 break;
            proxy_pass http://playground;

            limit_req zone=playground burst=10 nodelay;
            client_max_body_size 32k;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # The response is a server-sent event stream; buffering would hold it back.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        location / {
            grpc_pass grpc://grpc_router;

            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
    }
}