[project]
name = "readie-executor"
version = "0.1.0"
description = "Runs inside a checkpoint-restore sandbox and executes the function the worker sends it"
readme = "README.md"
# The floor is not ours to choose freely: this is installed into the rootfs
# image, so it has to run on whatever Python that image ships.
requires-python = "~=3.12.0"
license = { text = "Apache-2.0" }

dependencies = [
    "cloudpickle>=3.1",
]

[project.scripts]
readie-executor = "readie_executor.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readie_executor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F","E","W","I","N","UP","B","A","C4","DTZ","T20","PT","RET","SIM","ARG","PTH","ERA","PL","RUF","S","TID","D","TRY","EM","BLE"]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913",
    # print() is the executor's only output channel, and deliberately so. Its
    # stdout and stderr are what the worker captures and streams to the client
    # as logs. A logging handler would add startup cost and a file
    # descriptor inside a process that is about to be checkpointed, for nothing.
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "D100", "D101", "D102", "D103", "D104", "PLR2004",
    "ARG001", "ARG002", "PLC0415", "SLF001",
    "EM101", "TRY003", "TRY301",  # a raise in a three-line test needs no ceremony
    "S108",             # /tmp is the sandbox's real EXECUTOR_DIR
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cloudpickle.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/readie_executor"]
