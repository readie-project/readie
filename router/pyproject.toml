[project]
name = "readie-router"
version = "0.1.0"
description = "Routes serverless execution requests to checkpoint-restore workers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "grpcio>=1.78.1",
    "grpcio-health-checking>=1.78.0",
    "grpcio-reflection>=1.78.0",
    "protobuf>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
readie-router = "readie_router.main:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.78.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-protobuf>=5.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readie_router"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Generated code is not ours to lint or format.
extend-exclude = ["src/readie_router/proto"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",
    "I",     # import sorting
    "N",     # naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "A",     # shadowed builtins
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "T20",   # no print()  -- the old router logged with print
    "PT",    # pytest style
    "RET",   # return simplification
    "SIM",
    "ARG",   # unused arguments
    "PTH",
    "ERA",   # commented-out code
    "PL",    # pylint subset
    "RUF",
    "ASYNC", # blocking calls in async code
    "S",     # bandit
    "TID",   # tidy imports
    "D",     # docstrings
]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # constructor injection legitimately takes many arguments
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use magic numbers, and skip docstrings on every case.
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "PLR2004", "ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# grpcio ships no type information, and the generated stubs are only partially
# typed: grpcio-tools emits a .pyi for _pb2 but nothing for _pb2_grpc.
module = [
    "grpc.*",
    "grpc_health.*",
    "grpc_reflection.*",
    "readie_router.proto.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "readie_router.proto.*"
ignore_errors = true

[[tool.mypy.overrides]]
# grpcio-tools emits a typed .pyi for the message module but nothing at all for
# the service module, so every stub constructor and registration helper is
# untyped. These are the only modules that touch them; everything else stays
# fully strict.
module = [
    "readie_router.grpcserver.server",
    "readie_router.workers.client",
    "tests.integration.*",
]
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/readie_router"]
omit = ["src/readie_router/proto/*"]
